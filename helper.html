<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAMURAI BBox Tool - Slider Edition</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        canvas { border: 2px solid #ed1c24; cursor: crosshair; background: black; box-shadow: 0 0 20px rgba(237, 28, 36, 0.2); max-width: 90vw; }
        .controls { background: #333; padding: 15px; border-radius: 8px; margin: 10px; width: 90%; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; }
        .slider-container { width: 90%; display: flex; align-items: center; gap: 10px; background: #222; padding: 10px; border-radius: 5px; }
        input[type=range] { flex-grow: 1; cursor: pointer; accent-color: #ed1c24; }
        button { padding: 8px 15px; cursor: pointer; background: #444; color: white; border: 1px solid #666; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #666; border-color: #fff; }
        #save-btn { background: #d4a017; color: black; border-color: #d4a017; }
        #save-btn:hover { background: #ffcf40; }
        #download-btn { background: #1565c0; border-color: #1565c0; }
        .data-log { width: 90%; max-height: 120px; overflow-y: auto; background: #000; padding: 10px; font-family: 'Courier New', monospace; font-size: 12px; margin-top: 10px; border: 1px solid #444; color: #00ff00; }
        .frame-count { font-family: monospace; min-width: 100px; text-align: center; font-size: 1.1em; color: #ffcf40; }
    </style>
</head>
<body>

    <h2>Hulkbuster BBox Tracker Tool</h2>
    
    <div class="controls">
        <input type="file" id="videoUpload" accept="video/*">
        <button onclick="changeFrame(-1)">-1 Frame</button>
        <button onclick="changeFrame(1)">+1 Frame</button>
        <div class="frame-count" id="frameDisplay">Frame: 0</div>
    </div>

    <div class="slider-container">
        <span>Start</span>
        <input type="range" id="frameSlider" min="0" value="0" step="1">
        <span>End</span>
    </div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <button id="save-btn" onclick="saveCurrentBox()">SAVE BOX FOR THIS FRAME</button>
        <button id="download-btn" onclick="downloadJSON()">DOWNLOAD JSON FOR COLAB</button>
        <button onclick="clearLast()" style="background:#7c0a02">Clear Frame</button>
    </div>

    <div class="data-log" id="log">No prompts saved yet. Data will appear here...</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.createElement('video');
        const log = document.getElementById('log');
        const slider = document.getElementById('frameSlider');
        
        let savedPrompts = {}; 
        let startX, startY, isDrawing = false;
        let currentBbox = null;
        let fps = 30; // Standard default

        // 1. Handle Video Upload & Metadata
        document.getElementById('videoUpload').onchange = function(e) {
            const file = e.target.files[0];
            video.src = URL.createObjectURL(file);
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                // Update slider max based on duration
                const totalFrames = Math.floor(video.duration * fps);
                slider.max = totalFrames;
                drawVideoFrame();
            };
        };

        // 2. Navigation Logic
        function changeFrame(dir) {
            video.currentTime += dir * (1 / fps);
        }

        // Slider Input Listener
        slider.oninput = function() {
            video.currentTime = this.value / fps;
        };

        // When video seeks, update everything
        video.onseeked = drawVideoFrame;

        function drawVideoFrame() {
            const frameIdx = Math.round(video.currentTime * fps);
            
            // Sync slider and text
            slider.value = frameIdx;
            document.getElementById('frameDisplay').innerText = "Frame: " + frameIdx;

            // Clear and Draw
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Draw already saved box if it exists for this frame
            if (savedPrompts[frameIdx]) {
                drawBox(savedPrompts[frameIdx], "#00ff00"); // Saved boxes are Green
            }
        }

        // 3. Drawing Logic (Canvas)
        canvas.onmousedown = (e) => {
            const rect = canvas.getBoundingClientRect();
            // Scaling coordinates in case canvas is resized by CSS
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            startX = (e.clientX - rect.left) * scaleX;
            startY = (e.clientY - rect.top) * scaleY;
            isDrawing = true;
        };

        canvas.onmousemove = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const currX = (e.clientX - rect.left) * scaleX;
            const currY = (e.clientY - rect.top) * scaleY;
            
            drawVideoFrame(); // Redraw frame to clear previous drag-lines
            ctx.strokeStyle = "#ffcf40"; // Active drawing is Gold
            ctx.lineWidth = 3;
            ctx.strokeRect(startX, startY, currX - startX, currY - startY);
        };

        canvas.onmouseup = (e) => {
            isDrawing = false;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const endX = (e.clientX - rect.left) * scaleX;
            const endY = (e.clientY - rect.top) * scaleY;
            
            currentBbox = [
                Math.round(Math.min(startX, endX)),
                Math.round(Math.min(startY, endY)),
                Math.round(Math.max(startX, endX)),
                Math.round(Math.max(startY, endY))
            ];
        };

        function drawBox(bbox, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(bbox[0], bbox[1], bbox[2] - bbox[0], bbox[3] - bbox[1]);
        }

        // 4. Data Management
        function saveCurrentBox() {
            if (!currentBbox) return alert("Please draw a box on the Hulkbuster first!");
            const frameIdx = Math.round(video.currentTime * fps);
            savedPrompts[frameIdx] = currentBbox;
            updateLog();
            drawVideoFrame(); // Refresh to show green box
        }

        function updateLog() {
            log.innerHTML = "<strong>READY FOR EXPORT:</strong><br>" + JSON.stringify(savedPrompts);
        }

        function downloadJSON() {
            if (Object.keys(savedPrompts).length === 0) return alert("No boxes saved!");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedPrompts));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "samurai_prompts.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function clearLast() {
            const frameIdx = Math.round(video.currentTime * fps);
            delete savedPrompts[frameIdx];
            drawVideoFrame();
            updateLog();
        }
    </script>
</body>
</html>
